name: quick_tutor
description: "Quick Tutor — Ghana 1-on-1 Tutoring & Exam Preparation Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  provider: ^6.1.2

  # Networking & Real-Time
  http: ^1.2.1
  dio: ^5.4.3+1
  socket_io_client: ^2.0.3+1
  web_socket_channel: ^2.4.5

  # Storage & Security
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # UI, Icons, Typography & Feedback
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.1
  fluttertoast: ^8.2.5
  url_launcher: ^6.2.6

  # Media & Classroom
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
